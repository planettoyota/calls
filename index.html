<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="New Vehicle Billing">
<meta name="theme-color" content="#eb0a1e">
<title>Planet Toyota - New Vehicle Billing</title>
<style>
:root{--red:#eb0a1e;--ink:#1c1c1e;--mut:#6b7280;--line:#e5e7eb;--bg:#f4f5f7;--ok:#15803d;--okbg:#dcfce7;--pd:#b45309;--pdbg:#fef3c7}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg)}
button{font:inherit;border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 12px;cursor:pointer;color:var(--ink)}
button.pri{background:var(--red);border-color:var(--red);color:#fff;font-weight:600}
button:disabled{opacity:.5;cursor:default}
input,select{font:inherit;width:100%;padding:9px 10px;border:1px solid #cfd3da;border-radius:8px;background:#fff;color:var(--ink)}
input[type=checkbox]{width:auto;margin-right:8px}
input:disabled,select:disabled{background:#f1f2f4;color:#4b5563}
label{display:block;font-size:12px;color:var(--mut);margin-bottom:10px}
label input,label select{margin-top:3px;font-size:15px}
label.ck{font-size:15px;color:var(--ink);margin-bottom:6px}
.hide{display:none!important}
#login{max-width:320px;margin:18vh auto 0;padding:24px;background:#fff;border-radius:14px;text-align:center;box-shadow:0 2px 12px rgba(0,0,0,.08)}
#login h1{font-size:20px;margin:0 0 4px}#login p{color:var(--mut);margin:0 0 16px}
#login input{text-align:center;font-size:22px;letter-spacing:6px;margin-bottom:12px}
#login button{width:100%}
header{background:var(--red);color:#fff;padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top));display:flex;align-items:center;gap:6px;position:sticky;top:0;z-index:5}
header b{flex:1;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header small{opacity:.85;font-weight:400}
#hdrFile{display:block;font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
header button{background:rgba(255,255,255,.16);border-color:transparent;color:#fff;padding:6px 9px}
header button.new{background:#fff;color:var(--red);font-weight:700}
#main{display:grid;grid-template-columns:1fr;height:calc(100% - 52px)}
#left{overflow:auto;padding:10px}
#tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
#tabs::-webkit-scrollbar{display:none}
#tabs button{white-space:nowrap;padding:6px 12px;font-size:13px;border-radius:99px}
#tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
#tabs i{font-style:normal;opacity:.7;margin-left:4px}
#tabs button.alert i{opacity:1;background:var(--red);color:#fff;border-radius:99px;padding:0 6px}

.asbar{position:sticky;top:-10px;z-index:6;background:#eef7f0;color:#1d6b3a;border:1px solid #cfe7d6;border-radius:10px;padding:7px 10px;font-size:13px;margin-bottom:10px}
.asbar.saving{background:#f3f4f6;color:var(--mut);border-color:var(--line)}.asbar.error,.asbar.wait{background:#fff4f4;border-color:#f2c9c9}
.asbar button{padding:3px 9px;font-size:12px;margin-left:6px}
.filters{display:flex;gap:6px;margin-bottom:8px}
.item{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.item.sel{border-color:var(--red);box-shadow:0 0 0 1px var(--red)}
.item .top{display:flex;justify-content:space-between;gap:8px}
.item .nm{font-weight:600}.item .sub{color:var(--mut);font-size:13px}.item .chs{font:12px/1.3 ui-monospace,Menlo,Consolas,monospace;color:#374151;margin-top:1px}.item .arc{font:600 11px/1 inherit;color:#475467;background:#f2f4f7;border-radius:6px;padding:2px 6px;margin-left:6px}
.chip.warn{background:#fff4e0;color:#9a5800}.chip.bad{background:#fdecee;color:#b3261e}
.care .psfchips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}.care h4{margin:14px 0 6px}
.psfform{border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0;background:#fafbfc}.psfform h4{margin:0 0 8px}
.psfout{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:8px}.psfform .psfout .opt{display:flex;align-items:center;gap:6px;font-weight:500;margin:0;white-space:nowrap}.psfform .psfout input{display:inline-block;width:auto;margin:0}
.psfform label,#compNew label{display:block;margin:8px 0}.psfform select,.psfform input,#compNew select,#compNew input{display:block;width:100%;margin-top:4px}
.psfpitch{border-top:1px dashed var(--line);margin-top:10px;padding-top:8px}.psfhist>div,.psfrow{padding:8px 0;border-top:1px solid var(--line)}
.psfact{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.psfact input,.psfact select{flex:1;min-width:140px}
.oldbox{padding:10px 4px;text-align:center}.oldbox p{margin:0 0 6px;color:var(--mut);font-size:13px}
.age{font-size:12px;color:var(--mut);white-space:nowrap}.age.old{color:var(--red);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.chip{font-size:11px;padding:2px 7px;border-radius:99px;background:var(--pdbg);color:var(--pd);font-weight:400}
.chip.ok{background:var(--okbg);color:var(--ok)}.chip.na{background:#eef0f3;color:var(--mut)}
/* file list: groups, stage bar, next step, EDP desk row */
.grp{display:flex;justify-content:space-between;font-size:12px;font-weight:600;color:var(--mut);margin:12px 2px 6px;text-transform:none}
.grp:first-child{margin-top:2px}
.item .bdg{font-size:12px;padding:2px 8px;border-radius:99px;white-space:nowrap;height:fit-content}
.bdg.g{background:var(--okbg);color:var(--ok)}.bdg.a{background:var(--pdbg);color:var(--pd)}.bdg.r{background:#fde8e8;color:#b3261e}.bdg.n{background:#eef0f3;color:var(--mut)}
.sbar{display:flex;gap:3px;margin:9px 0 2px}.sbar i{flex:1;height:6px;border-radius:3px;background:#e5e7eb}
.sbar i.ok{background:#22a35a}.sbar i.go{background:#f0b429}
.slab{display:flex;justify-content:space-between;font-size:11px;color:var(--mut)}.slab b{color:var(--ink);font-weight:600}
.nxt{font-size:13px;margin-top:7px;color:var(--red);font-weight:600}.nxt.w{color:var(--mut);font-weight:400}.nxt.d{color:var(--ok)}
.edp{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-top:7px;font-size:12px;color:var(--mut)}
.edp .chip{font-size:12px}
.pay{font-size:11px;color:var(--mut);text-align:right;margin-top:3px}
#right{background:var(--bg);overflow:auto;padding:10px;padding-bottom:40px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.card h3,.card summary{margin:0;font-size:15px;font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:8px;cursor:pointer}
.card h3{margin-bottom:10px;cursor:default}
details.card[open] summary{margin-bottom:12px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";color:var(--mut);font-size:18px;margin-left:auto}
details[open]>summary::after{content:"–"}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.dhead{display:flex;gap:10px;align-items:flex-start;margin-bottom:10px}
.dhead h2{margin:0;font-size:18px}.dhead .sub{color:var(--mut);font-size:13px}
.doc{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.doc:first-of-type{border-top:0}
.doc .t{flex:1;min-width:120px}.doc .miss{color:var(--red);font-size:12px;font-weight:600}
.doc button{padding:4px 9px;font-size:13px}
.claim{border-top:1px solid var(--line);padding-top:10px;margin-top:6px}
.nsb{border-radius:10px;padding:10px 12px;margin-bottom:10px;font-size:14px;line-height:1.5;border-left:5px solid var(--red);background:#fff1f2}.nsb .h{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--red)}.nsb .m{font-weight:700;font-size:15px}.nsb .o{font-size:12px;color:var(--mut);margin-top:3px}.nsb.w{border-color:#2563eb;background:#eff6ff}.nsb.w .h{color:#2563eb}.nsb.d{border-color:var(--ok);background:var(--okbg)}.nsb.d .h{color:var(--ok)}.nsb.n{border-color:var(--line);background:#f8f9fb}.nsb.n .h{color:var(--mut)}
.sum{background:#f8f9fb;border-radius:8px;padding:8px 10px;font-size:13px;margin-bottom:10px;line-height:1.7}
.sum b{white-space:nowrap}
.mut{color:var(--mut)}.empty{text-align:center;color:var(--mut);padding:40px 10px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;z-index:30;max-width:90%;text-align:center}
#busy{position:fixed;inset:0;background:rgba(255,255,255,.55);z-index:25;display:flex;align-items:center;justify-content:center;font-weight:600}
#viewer{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px}
#viewer img{max-width:100%;max-height:82vh;border-radius:6px}
#viewer a{color:#fff;font-size:17px}
#stockBox{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:15;display:flex;justify-content:center;align-items:flex-end}
#stockBox .sheet{background:#fff;width:100%;max-width:720px;height:88vh;border-radius:14px 14px 0 0;padding:12px;display:flex;flex-direction:column;gap:8px}
#stockBox .shead{display:flex;justify-content:space-between;align-items:center}
#stockL{overflow:auto;flex:1}
.st{display:flex;gap:8px;align-items:center;border-top:1px solid var(--line);padding:8px 0}
.st div{flex:1;min-width:0}.st .sub{color:var(--mut);font-size:12px;word-break:break-all}
@media (max-width:899px){
  #right{position:fixed;inset:0;top:calc(52px + env(safe-area-inset-top));z-index:4;display:none}
  #right.open{display:block}
}
@media (min-width:900px){
  #main{grid-template-columns:390px 1fr}
  #left{border-right:1px solid var(--line)}
  .back{display:none}
  .grid{grid-template-columns:1fr 1fr 1fr}
  #stockBox{align-items:center}#stockBox .sheet{border-radius:14px;height:80vh}
}

/* ---------- printed forms ---------- */
#print{display:none}
.pg{width:210mm;height:296mm;padding:11mm 13mm;position:relative;overflow:hidden;page-break-after:always;background:#fff;color:#000;font:10.5pt/1.4 Arial,"Nirmala UI","Noto Sans Devanagari",sans-serif}
.pg.img{padding:6mm}
.pg h1{font-size:14pt;text-align:center;margin:3mm 0 4mm;text-decoration:underline}
.pg h4{font-size:10.5pt;margin:3mm 0 1.5mm}
.pg p{margin:0 0 2.2mm}
.ov{position:relative;width:198mm}.ov img{width:100%;display:block}
.ov span{position:absolute;font:8.5pt/1 Arial,sans-serif;white-space:nowrap;transform:translateY(-55%)}
.lh{text-align:center;border-bottom:1.5px solid #000;padding-bottom:2mm;margin-bottom:2mm;line-height:1.3}
.lh .n{font:700 20pt Georgia,"Times New Roman",serif;letter-spacing:.5px}
.fl{display:inline-block;border-bottom:1px dotted #000;min-width:30mm;padding:0 1.5mm;font-weight:700;vertical-align:bottom;min-height:1.3em}
.ln{display:flex;gap:2mm;align-items:flex-end;margin-bottom:4.2mm}.ln .fl{flex:1}
.box{display:inline-block;width:9mm;height:5mm;border:1px solid #000;vertical-align:middle;text-align:center;line-height:5mm;font-weight:700;margin:0 6mm 0 2mm}
.pg table{border-collapse:collapse;width:100%}
.pg td,.pg th{border:1px solid #000;padding:.9mm 1.5mm;font-size:8.8pt;height:5.6mm}
.bo td{height:5.05mm;padding:.4mm 1.5mm;font-size:8.3pt}.bo td:nth-child(odd){text-align:center;width:23%;white-space:nowrap}.bo td:nth-child(even){font-weight:700;width:27%}
.bo .hd{font-weight:700;text-decoration:underline;text-align:center}
.kv.big td{font-size:10.5pt;height:8mm}.kv td:nth-child(odd){width:20%;background:#f2f2f2}.kv td:nth-child(even){width:30%;font-weight:700}
.sig{display:flex;justify-content:space-between;gap:8mm;position:absolute;left:13mm;right:13mm;bottom:14mm;font-size:9.5pt}.sig.flow{position:static;margin-top:15mm}
.sig div{flex:1;border-top:1px solid #000;padding-top:1.5mm;text-align:center}
.hi{font-size:10.5pt;line-height:1.75}.hi p{margin-bottom:2.6mm;text-align:justify}
@media print{
  @page{size:A4;margin:0}
  html,body{height:auto;background:#fff}
  body>*:not(#print){display:none!important}
  #print{display:block}
}
.bo td.cap,.cap{text-transform:uppercase;font-size:9.3pt}
.ck2 td{font-size:8.4pt;height:4.7mm;padding:.3mm 1.5mm}
.pg h4{margin:2.2mm 0 1.2mm}
.inv{font:8.4pt/1.28 'Times New Roman',Times,serif;padding:8mm 12mm}
.inv .lhs{position:absolute;left:0;right:0;border:1px dashed #999;color:#999;display:flex;align-items:center;justify-content:center;font-size:11pt;box-sizing:border-box}
.inv table{border-collapse:collapse;width:100%}.inv td,.inv th{font-size:8.4pt;height:auto;padding:.6mm 1.6mm;vertical-align:middle}
.inv table.nb td{border:0;padding:.25mm 0;vertical-align:top}.inv .k{white-space:nowrap;width:1%;padding-right:4mm!important}
.inv .ih{display:flex;align-items:flex-start;margin:0 0 2.5mm}.inv .ih>div{flex:1}.inv .ih .c{text-align:center;flex:2}.inv .ih .r{text-align:right;font-size:7pt;line-height:1.2}
.inv .i2{display:flex;gap:6mm}.inv .i2>table:first-child{flex:1.5}.inv .i2>table:last-child{flex:1;width:auto}
.inv .ad{margin:2.5mm 0 1.5mm}.inv .ad td{padding:.6mm 0!important}.inv .ad td.k{padding-right:4mm!important}
.inv .bx td,.inv .bx th{border:1px solid #000}.inv .bx th{font-weight:700;text-align:center}.inv .r{text-align:right}.inv .c{text-align:center}.inv .b{font-weight:700}
.inv .tt td{text-align:center;font-weight:700;text-decoration:underline;border:1px solid #000}
.inv .nt{font-size:7.2pt;margin:.8mm 0 0}.inv .tc{font-size:6.6pt;line-height:1.24;text-align:justify}
.inv .is{position:absolute;left:12mm;right:12mm;bottom:9mm}.inv .s2{display:flex;justify-content:space-between;margin-top:14mm}.inv .s2 div{border-top:1px solid #000;padding:1mm 8mm 0;min-width:55mm;text-align:center}.inv .s2 div:last-child{min-width:72mm;padding:1mm 0 0}
.inv .draft{position:absolute;top:45%;left:0;right:0;text-align:center;font:700 70pt Arial;color:rgba(200,0,0,.13);transform:rotate(-30deg);pointer-events:none}
#invprev{position:fixed;inset:0;z-index:60;background:#55595f;display:flex;flex-direction:column}
#invprev .pvbar{background:#fff;padding:10px 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;box-shadow:0 1px 4px rgba(0,0,0,.3)}
#invprev .pvn{flex-basis:100%;color:#b3261e;font-size:13px}
#invprev .pvwrap{flex:1;overflow:auto;padding:8px}#invprev .pvz{margin:0 auto;width:210mm}
@media print{#invprev{display:none!important}}
</style>
</head>
<body>

<div id="login" class="hide">
  <h1>Planet Toyota</h1><p>New Vehicle Billing</p>
  <select id="uname" style="margin-bottom:12px;font-size:16px"><option value="">Loading names…</option></select>
  <input id="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="PIN">
  <button class="pri" id="loginBtn">Login</button>
</div>

<div id="app" class="hide">
  <header>
    <b>New Vehicle Billing <small id="who"></small><span id="hdrFile" class="hide"></span></b>
    <button class="new" id="newBtn">+ New</button>
    <button id="stockBtn">Stock</button>
    <button id="trBtn" class="hide" title="Sell a stock vehicle to another dealer">Stock transfer</button>
    <button id="refBtn">Refresh</button>
    <button id="outBtn">Logout</button>
  </header>
  <div id="main">
    <div id="left">
      <div id="alertBar" class="hide" style="margin:0 0 8px"><button id="alertBtn" style="width:100%">🔔 Turn on alerts for new proposal requests and files</button></div>
      <div id="tabs"></div>
      <div class="filters">
        <input id="q" placeholder="Search name, mobile, chassis, file no.">
        <select id="seF" style="max-width:150px"></select>
      </div>
      <div id="list"></div>
      <div id="verFoot" class="mut" style="font-size:11px;text-align:center;margin:10px 0"></div>
    </div>
    <div id="right"><div class="empty">Select a file</div></div>
  </div>
</div>

<input type="file" id="fileIn" accept="image/*,application/pdf" multiple class="hide">
<datalist id="models"><option>Glanza<option>Urban Cruiser Taisor<option>Rumion<option>Urban Cruiser Hyryder<option>Innova Crysta<option>Innova Hycross<option>Fortuner<option>Legender<option>Hilux<option>Camry<option>Vellfire<option>Land Cruiser 300</datalist>
<datalist id="ctypes"><option>Exchange bonus<option>Loyalty bonus<option>Corporate discount<option>Consumer offer<option>Other</datalist>
<div id="viewer" class="hide"></div>
<div id="stockBox" class="hide"><div class="sheet">
  <div class="shead"><b id="stockT">Stock</b><button id="stockX">Close</button></div>
  <input id="stockQ" placeholder="Search model, variant, colour, chassis">
  <div id="stockL"></div>
</div></div>
<div id="busy" class="hide">Please wait…</div>
<div id="toast" class="hide"></div>
<div id="print"></div>

// Actions that only read, or that give the same result when repeated: these are tried a second time by themselves.
const SAFE_RETRY = ['updateDeal','names','login','list','stock','file','invoicePreview','syncSheet','deskCheck','confirmInvoice'];
async function jsonp(action, data){
  try { return await jsonp1(action, data); }
  catch (e) {
    if (e.message !== 'Network error') throw e;
    if (SAFE_RETRY.includes(action)) { await new Promise(r => setTimeout(r, 1500)); return await postDiag(action, data); }
    // find out whether the server can be reached at all
    let up = false; try { await jsonp1('names'); up = true; } catch (x) {}
    throw new Error(!navigator.onLine || !up ? 'No connection to the server. Check the internet on this device and try again.'
      : SAFE_RETRY.includes(action) ? 'The server is reachable but "' + action + '" failed twice. Wait a minute and try again.'
      : 'The connection dropped during "' + action + '". Press Refresh and check whether it was saved before trying again.');
  }
}
function jsonp1(action, data){
  return new Promise((res, rej) => {
    const cb = 'cb' + Date.now() + Math.floor(Math.random()*1e6), s = document.createElement('script');
    const done = () => { clearTimeout(t); delete window[cb]; s.remove(); };
    const t = setTimeout(() => { done(); rej(new Error('Server did not respond')); }, 45000);
    window[cb] = r => { done(); verCheck(r); r && r.ok ? res(r) : rej(new Error((r && r.error) || 'Error')); };
    s.onerror = () => { done(); rej(new Error('Network error')); };
    s.src = API + '?action=' + action + '&callback=' + cb + '&nonce=' + Date.now() +
      '&payload=' + encodeURIComponent(JSON.stringify(Object.assign({ptk: ptTok(), dev: DEV}, data || {})));
    document.body.appendChild(s);
  });
}

}
// Second try by POST: the answer can be read even when it is an error page, so the real reason is shown.
async function postDiag(action, data){
  let txt = '';
  try {
    const r = await fetch(API, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(Object.assign({action, ptk: ptTok(), dev: DEV}, data || {}))});
    txt = await r.text();
  } catch (e) { throw new Error(!navigator.onLine ? 'No connection to the server. Check the internet on this device and try again.' : 'The server did not answer "' + action + '". Wait a minute and try again.'); }
  let j = null; try { j = JSON.parse(txt); } catch (_) {}
  if (j) { verCheck(j); if (!j.ok) throw new Error(j.error || 'Error'); return j; }
  const t = (/<title>([^<]*)<\/title>/i.exec(txt) || [])[1] || '', body = txt.replace(/<style[\s\S]*?<\/style>|<script[\s\S]*?<\/script>/gi, ' ').replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
  throw new Error('Server error in "' + action + '": ' + (body || t).slice(0, 220));
}
async function post(action, data){
  const r = await fetch(API, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify(Object.assign({action, ptk: ptTok(), dev: DEV}, data))});
  const j = await r.json();
  if (!j.ok) { const e = new Error(j.error || 'Error'); e.server = true; throw e; }
  return j;
}
// Second route for uploads when the browser blocks the direct request: an ordinary form post into a hidden frame.
function formPost(action, data){

  if (!fr) { fr = document.createElement('iframe'); fr.id = fr.name = 'upFrame'; fr.style.display = 'none'; document.body.appendChild(fr); }
  const f = document.createElement('form'), i = document.createElement('input');

  i.type = 'hidden'; i.name = 'payload'; i.value = JSON.stringify(Object.assign({action, ptk: ptTok(), dev: DEV}, data));
  f.appendChild(i); document.body.appendChild(f); f.submit(); f.remove();
}

    const tries = mine.filter(c => c.Outcome === 'Not reachable').length, last = mine[mine.length - 1]; let due = addDays(dd, PSF_CALLS[k]);

function ptPortalVerify() {          // asks the portal: is this phone logged in, and allowed in this app?
  return new Promise(function (resolve, reject) {
    var s = null;
    try { s = JSON.parse(localStorage.getItem('pt_portal') || 'null'); } catch (e) {}
    if (!s || !s.token || !s.api) { reject({ code: 'LOGIN', message: 'Please log in to the Staff Portal.' }); return; }

  });
}

function prep(file){
  return new Promise((res, rej) => {
    if (!file.type.startsWith('image/')) {
      if (file.type !== 'application/pdf') return rej(new Error('Only photos and PDFs can be uploaded'));
      if (file.size > 4e6) return rej(new Error('PDF is larger than 4 MB'));
      const r = new FileReader();
      r.onload = () => res({mime: 'application/pdf', b64: r.result.split(',')[1]});
      r.onerror = () => rej(new Error('Could not read file'));
      return r.readAsDataURL(file);
    }
    const img = new Image(), u = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, 1600 / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(u);
      res({mime: 'image/jpeg', b64: c.toDataURL('image/jpeg', 0.75).split(',')[1]});
    };
    img.onerror = () => rej(new Error('Could not read this photo'));
    img.src = u;
  });
}

async function doUpload(file){

    let err = null;

function saveFile(b64, mime, name){   // download a file to this device
  const bin = atob(b64), arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  const url = URL.createObjectURL(new Blob([arr], {type: mime})), a = document.createElement('a');
  a.href = url; a.download = name || 'document'; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}

    });
  }
  else if (act === 'amPrint') { const a = (DB.amendments || []).find(x => x.AmendID === b.dataset.am); if (a) printAmend(d, a); }
  else if (act === 'tfCreate') {
    const data = tfVals(); data.Chassis = $('tfChassis').value;
    if (!data.Customer || !data.GSTNo || !data.Address) return toast('Enter the dealer name, GST number and billing address');
    const g = gstProblem({GSTNo: data.GSTNo, PAN: data.GSTNo.toUpperCase().slice(2, 12)}); if (g) return toast(g);
    if (!data.Chassis) return toast('Pick the vehicle');
    run(async () => { const r = await jsonp('createTransfer', {data, saveDealer: $('tfSaveDealer').checked ? 1 : '0'}); putDeal(r.deal); cur = r.deal.DealID; tab = 'all'; render(); toast('Stock transfer ' + cur + ' opened'); });
  }
  else if (act === 'tfSave') run(async () => { putDeal((await jsonp('saveTransfer', {id: cur, fields: tfVals()})).deal); render(); toast('Saved'); });
  else if (act === 'tfClose') { if (confirm('Close this transfer? Do it once the vehicle has left for the dealer.')) run(async () => { putDeal((await jsonp('closeTransfer', {id: cur})).deal); render(); toast('Transfer closed'); }); }
  else if (act === 'tfCancel') { if (confirm('Cancel this transfer? The vehicle goes back to free stock.')) run(async () => { putDeal((await jsonp('closeTransfer', {id: cur, cancel: 1})).deal); render(); toast('Transfer cancelled'); }); }
  else if (act === 'create') {
    const data = changed($('newCard'), {});
    if (MODELS.length && !(data.Model && data.Variant && data.Colour && data.Suffix)) return toast('Select the model, variant, colour and suffix');
    if (!MODELS.length && !(data.Model && data.Variant && data.Colour)) return toast('Enter the model, variant and colour');
    run(async () => { const r = await jsonp('createDeal', {data}); putDeal(r.deal); cur = r.deal.DealID; tab = 'all'; asSet('saved'); render(); toast('File ' + cur + ' opened'); });
  }
};
(function(){ if (window.__TEST) return; let m = ''; try { m = sessionStorage.getItem('dfmsg') || ''; sessionStorage.removeItem('dfmsg'); } catch (_) {} if (m) toast(m);
  store.clear(); ptLogin(); })();
</script>
